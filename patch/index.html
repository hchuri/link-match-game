<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PatchPlanner – AV &amp; Network Patching</title>
<style>
:root{
  --bg:#0b1120; --panel:#111a2e; --panel2:#17223a; --line:#26324d; --text:#e2e8f0; --muted:#8b9ab5;
  --accent:#38bdf8; --accent2:#0ea5e9; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --row:22px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#0b1426;border:1px solid var(--line);border-radius:6px;padding:5px 8px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;min-height:60px;resize:vertical}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
button.danger{color:#fca5a5}
button.danger:hover{border-color:var(--err)}
button.sm{padding:2px 7px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;background:#0a0f1c;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header .logo{font-weight:800;font-size:16px;letter-spacing:.3px}
header .logo span{color:var(--accent)}
header .proj{color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:7px 10px;color:var(--muted)}
nav button.active{color:var(--text);border-bottom-color:var(--accent)}
nav .badge{background:var(--err);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.spacer{flex:1}
main{padding:16px;max-width:1700px;margin:0 auto}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px}
.form label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12px}
.form label.full{grid-column:1/-1}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel);cursor:default;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
tr:hover td{background:#14203a}
td input,td select{width:100%;padding:3px 6px}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid var(--line);background:#0b1426;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.err{color:#fca5a5}.warn{color:#fcd34d}.ok{color:#86efac}
.issue{padding:6px 8px;border-left:3px solid var(--warn);background:#1a1f2e;margin-bottom:6px;border-radius:4px}
.issue.error{border-left-color:var(--err)}
.issue.info{border-left-color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.tablewrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.chk{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
/* Racks */
.racks{display:flex;gap:22px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.rack{flex:none;width:330px}
.rack-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rack-frame{background:#1f2937;border:6px solid #374151;border-radius:6px;padding:0 0 0 26px;position:relative}
.rack-body{position:relative;background:#0a0f1a}
.u-slot{position:absolute;left:0;right:0;height:var(--row);border-bottom:1px dashed #1e293b}
.u-slot.over{background:rgba(56,189,248,.25)}
.u-num{position:absolute;left:-24px;width:20px;text-align:right;font-size:10px;color:#6b7280;line-height:var(--row)}
.rack-dev{position:absolute;left:2px;right:2px;border-radius:3px;padding:2px 6px;overflow:hidden;cursor:grab;border:1px solid rgba(255,255,255,.25);font-size:11px;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.rack-dev b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rack-dev small{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rack-dev .x{position:absolute;right:3px;top:2px;opacity:0;cursor:pointer;background:rgba(0,0,0,.4);border-radius:3px;padding:0 4px}
.rack-dev:hover .x{opacity:1}
body.dragging .rack-dev{pointer-events:none}
.tray{width:240px;flex:none;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:8px;min-height:200px}
.tray.over{border-color:var(--accent)}
.tray-item{padding:5px 8px;margin-bottom:5px;border-radius:5px;cursor:grab;font-size:12px;border:1px solid rgba(255,255,255,.2)}
/* Patch */
.patch{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;min-height:420px}
.pane-head{display:flex;gap:8px;margin-bottom:8px}
.pane-head select{flex:1}
.ports{overflow:auto;max-height:56vh}
.port{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid transparent;border-radius:6px;cursor:pointer}
.port:hover{background:#14203a}
.port.sel{border-color:var(--accent);background:#0c2a40}
.port.used .pname{color:var(--muted)}
.port.dim{opacity:.35}
.port.compat{background:rgba(34,197,94,.07)}
.pname{min-width:110px;font-weight:600}
.pdir{width:18px;text-align:center;color:var(--muted)}
.plink{color:var(--muted);font-size:12px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.connectbar{position:sticky;bottom:0;background:#0d1628;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.connectbar .sum{flex:1;min-width:260px}
/* Flow */
.flowwrap{background:#070c17;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:78vh}
.flowwrap svg text{font-family:system-ui,sans-serif}
/* Labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.label{background:#fff;color:#111;border-radius:4px;padding:8px 10px 8px 14px;position:relative;font-size:11px;border:1px solid #ccc;break-inside:avoid}
.label .bar{position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:4px 0 0 4px}
.label .cid{font:700 18px ui-monospace,Menlo,Consolas,monospace}
.label .end{float:right;font-weight:700;border:1px solid #111;border-radius:3px;padding:0 5px}
/* Report */
.report{background:#fff;color:#111;border-radius:8px;padding:28px 34px;max-width:1100px;margin:0 auto}
.report h1{margin:0 0 4px;font-size:24px}
.report h2{font-size:16px;border-bottom:2px solid #111;padding-bottom:3px;margin-top:26px}
.report h3{font-size:13px;margin:16px 0 6px}
.report table{font-size:11px}
.report th{background:#f1f5f9;color:#111;position:static}
.report th,.report td{border:1px solid #cbd5e1;padding:3px 6px}
.report tr:hover td{background:none}
.report .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 16px;font-size:12px;margin:10px 0}
.report .meta div span{color:#64748b;display:block;font-size:10px;text-transform:uppercase}
.report .mini-rack{display:inline-block;vertical-align:top;margin:0 14px 14px 0;width:230px}
.report .mini-rack table td{height:15px;padding:0 4px;font-size:10px}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 10px}
#modal.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(980px,100%);padding:18px}
.modal h2{margin:0 0 12px;font-size:17px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--line);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
#toast.show{opacity:1}
@media print{
  body{background:#fff;color:#000}
  header,.no-print,nav,#toast{display:none!important}
  main{padding:0;max-width:none}
  .report{padding:0;border-radius:0}
  .report h2{break-after:avoid}
  .report .pb{break-before:page}
  .labels{grid-template-columns:repeat(3,1fr);gap:6px}
  .label{border:1px dashed #999}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <div class="logo">Patch<span>Planner</span></div>
  <div class="proj" id="projName"></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="sm" onclick="App.undo()" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button class="sm" onclick="App.exportJSON()">💾 Save file</button>
  <button class="sm" onclick="document.getElementById('fileIn').click()">📂 Open file</button>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none" onchange="App.importJSON(this)">
</header>
<main id="main"></main>
<div id="modal"><div class="modal" id="modalBody"></div></div>
<div id="toast"></div>

<script>

  if (n === 0) return [];
  if (n === 1 && start === null) return [{name: base, conn, dir, proto}];
  return Array.from({length: n}, (_, i) => ({name: `${base}${n > 1 || start !== 1 ? ' ' + (start + i) : ''}`.trim(), conn, dir, proto}));

const one = (name, conn, dir, proto = '') => ({name, conn, dir, proto});

/* ---------------- State ---------------- */

  cableSort:{key:'cableId', dir:1}, cableQ:'', cableType:'', devQ:'', devCat:'', flowSite:'', flowPower:false, flowAll:false, flowIds:true, flowFocus:'',
  labelType:'', netSite:'', drag:null};

function blankProject() {
  return {version:1, project:{name:'New Project', client:'', venue:'', date:'', engineer:'', contact:'', revision:'A', notes:''},
    sites:[], racks:[], devices:[], links:[], templates:[]};
}
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { S = normalize(JSON.parse(raw)); return; } } catch (e) { console.warn(e); }
  S = demoProject();
}
function normalize(d) {
  const b = blankProject();
  d = Object.assign(b, d || {});
  d.project = Object.assign(blankProject().project, d.project);
  for (const k of ['sites', 'racks', 'devices', 'links', 'templates']) if (!Array.isArray(d[k])) d[k] = [];
  d.devices.forEach(x => { x.ports = Array.isArray(x.ports) ? x.ports : []; x.ports.forEach(p => p.id = p.id || uid()); });
  return d;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { toast('Could not save to browser storage: ' + e.message); }
}
function snap() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 60) undoStack.shift(); }
function commit() { save(); render(); }

/* ---------------- Lookups ---------------- */
const devById = id => S.devices.find(d => d.id === id);
const siteById = id => S.sites.find(s => s.id === id);
const rackById = id => S.racks.find(r => r.id === id);
const portOf = (d, pid) => d && d.ports.find(p => p.id === pid);
const allTemplates = () => [...BUILTIN_TEMPLATES, ...S.templates];
const conn = c => CONNECTORS[c] || {group:c, label:c, cable:'Cable', prefix:'CBL', color:'#94a3b8'};
const catOf = c => CATEGORIES[c] || CATEGORIES.other;

function portMap() {
  const m = new Map();
  for (const l of S.links) { m.set(l.a.d + '|' + l.a.p, l); m.set(l.b.d + '|' + l.b.p, l); }
  return m;
}
function otherEnd(l, devId, portId) { return (l.a.d === devId && l.a.p === portId) ? l.b : l.a; }
function endText(e) {
  const d = devById(e.d), p = portOf(d, e.p);
  return d ? `${d.name} · ${p ? p.name : '?'}` : '(missing)';
}
function devLocation(d) {
  const s = siteById(d.siteId), r = rackById(d.rackId);
  return [s && s.name, r ? `${r.name}${d.uPos ? ' U' + d.uPos : ''}` : d.location].filter(Boolean).join(' / ');
}
function sortedDevices(list = S.devices) {
  const siteIdx = id => { const i = S.sites.findIndex(s => s.id === id); return i < 0 ? 999 : i; };
  return [...list].sort((a, b) => siteIdx(a.siteId) - siteIdx(b.siteId) || a.name.localeCompare(b.name, undefined, {numeric:true}));
}
function deviceOptions(selected, filter) {
  let html = '<option value="">— select device —</option>';
  const groups = [...S.sites.map(s => ({id:s.id, name:s.name})), {id:'', name:'(No site)'}];
  for (const g of groups) {
    const list = sortedDevices(S.devices.filter(d => (d.siteId || '') === g.id && (!filter || filter(d))));
    if (!list.length) continue;
    html += `<optgroup label="${esc(g.name)}">` + list.map(d => `<option value="${d.id}" ${d.id === selected ? 'selected' : ''}>${esc(d.name)} — ${esc(d.model)}</option>`).join('') + '</optgroup>';
  }
  return html;
}
function siteOptions(selected, allLabel) {
  return (allLabel ? `<option value="">${esc(allLabel)}</option>` : '') + S.sites.map(s => `<option value="${s.id}" ${s.id === selected ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
}

/* ---------------- Rack helpers ---------------- */
function rackOccupancy(rackId, excludeId) {
  const used = new Map();
  for (const d of S.devices) if (d.rackId === rackId && d.id !== excludeId && d.uPos && d.uHeight > 0)
    for (let u = d.uPos; u < d.uPos + d.uHeight; u++) used.set(u, d);
  return used;
}
function fits(rackId, bottomU, h, excludeId) {
  const r = rackById(rackId); if (!r) return false;
  if (bottomU < 1 || bottomU + h - 1 > r.heightU) return false;
  const used = rackOccupancy(rackId, excludeId);
  for (let u = bottomU; u < bottomU + h; u++) if (used.has(u)) return false;
  return true;
}
function firstFreeU(rackId, h, excludeId) {
  const r = rackById(rackId); if (!r || h < 1) return 0;
  for (let top = r.heightU; top - h + 1 >= 1; top--) if (fits(rackId, top - h + 1, h, excludeId)) return top - h + 1;
  return 0;
}

/* ---------------- Link logic ---------------- */
function checkLink(a, b, ignoreLinkId) {
  const errors = [], warns = [];
  const da = devById(a.d), db = devById(b.d), pa = portOf(da, a.p), pb = portOf(db, b.p);
  if (!pa || !pb) return {errors:['Select a port on both sides'], warns};
  if (a.d === b.d && a.p === b.p) errors.push('Cannot connect a port to itself');
  const pm = portMap();
  const la = pm.get(a.d + '|' + a.p), lb = pm.get(b.d + '|' + b.p);
  if (la && la.id !== ignoreLinkId) errors.push(`${da.name} · ${pa.name} is already patched (${la.cableId})`);
  if (lb && lb.id !== ignoreLinkId) errors.push(`${db.name} · ${pb.name} is already patched (${lb.cableId})`);
  if (conn(pa.conn).group !== conn(pb.conn).group) errors.push(`Connector mismatch: ${pa.conn} ↔ ${pb.conn} (needs adapter / converter)`);
  if (pa.dir === pb.dir && pa.dir !== 'io') warns.push(`Direction: ${pa.dir.toUpperCase()} → ${pb.dir.toUpperCase()} (both ports are ${pa.dir === 'in' ? 'inputs' : 'outputs'})`);
  const generic = ['', 'Uplink', 'PoE', 'Power', 'Analog'];
  if (pa.proto && pb.proto && pa.proto !== pb.proto && !generic.includes(pa.proto) && !generic.includes(pb.proto))
    warns.push(`Protocol differs: ${pa.proto} ↔ ${pb.proto}`);
  if (pa.vlan && pb.vlan && String(pa.vlan) !== String(pb.vlan)) warns.push(`VLAN differs: ${pa.vlan} ↔ ${pb.vlan}`);
  return {errors, warns, pa, pb, da, db};
}
function nextCableId(prefix, extra = []) {
  let max = 0;
  const re = new RegExp('^' + prefix + '-(\\d+)$');
  for (const id of [...S.links.map(l => l.cableId), ...extra]) { const m = re.exec(id || ''); if (m) max = Math.max(max, +m[1]); }
  return `${prefix}-${pad(max + 1, 3)}`;
}

/* ---------------- Issues / validation ---------------- */
function computeIssues() {
  const out = [];
  const add = (level, msg) => out.push({level, msg});
  // Links
  for (const l of S.links) {
    const da = devById(l.a.d), db = devById(l.b.d), pa = portOf(da, l.a.p), pb = portOf(db, l.b.p);
    if (!pa || !pb) { add('error', `Cable ${l.cableId} references a missing device/port`); continue; }
    if (conn(pa.conn).group !== conn(pb.conn).group) add('error', `${l.cableId}: connector mismatch ${pa.conn} ↔ ${pb.conn} (${da.name} → ${db.name})`);
    if (pa.dir === pb.dir && pa.dir !== 'io') add('warn', `${l.cableId}: ${pa.dir}→${pb.dir} (${endText(l.a)} → ${endText(l.b)})`);
  }
  const ids = {};
  S.links.forEach(l => { ids[l.cableId] = (ids[l.cableId] || 0) + 1; });
  Object.entries(ids).filter(([, n]) => n > 1).forEach(([id, n]) => add('error', `Cable ID ${id} is used ${n} times`));
  // IPs
  const ips = {};
  for (const d of S.devices) {
    if (!d.ip) continue;
    if (!/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/.test(d.ip)) add('error', `${d.name}: invalid IP "${d.ip}"`);
    (ips[d.ip] = ips[d.ip] || []).push(d.name);
  }
  Object.entries(ips).filter(([, l]) => l.length > 1).forEach(([ip, l]) => add('error', `Duplicate IP ${ip}: ${l.join(', ')}`));
  // Racks
  for (const r of S.racks) {
    const seen = new Map();
    for (const d of S.devices.filter(x => x.rackId === r.id && x.uHeight > 0 && x.uPos)) {
      if (d.uPos + d.uHeight - 1 > r.heightU) add('error', `${d.name} exceeds height of rack ${r.name}`);
      for (let u = d.uPos; u < d.uPos + d.uHeight; u++) {
        if (seen.has(u)) add('error', `Rack ${r.name} U${u}: ${seen.get(u)} overlaps ${d.name}`);
        seen.set(u, d.name);
      }
    }
    const w = S.devices.filter(x => x.rackId === r.id).reduce((t, d) => t + (+d.powerW || 0), 0);
    if (r.maxW && w > r.maxW) add('warn', `Rack ${r.name}: power ${w} W exceeds budget ${r.maxW} W`);
  }
  // Dante redundancy: Pri & Sec landing on same switch
  const pm = portMap();
  for (const d of S.devices) {
    const pri = d.ports.find(p => p.proto === 'Dante Pri'), sec = d.ports.find(p => p.proto === 'Dante Sec');
    if (!pri || !sec) continue;
    const lp = pm.get(d.id + '|' + pri.id), ls = pm.get(d.id + '|' + sec.id);
    if (lp && ls) {
      const op = otherEnd(lp, d.id, pri.id).d, os = otherEnd(ls, d.id, sec.id).d;
      if (op === os) add('warn', `${d.name}: Dante Primary and Secondary connect to the same switch (${devById(op)?.name}) — no redundancy`);
    }
  }
  // VLAN on switch port vs device
  for (const l of S.links) {
    for (const [me, other] of [[l.a, l.b], [l.b, l.a]]) {
      const pd = portOf(devById(me.d), me.p), od = devById(other.d);
      const op = portOf(od, other.p);
      if (pd && pd.vlan && od && od.vlan && op && String(pd.vlan) !== String(od.vlan) && !op.vlan && op.proto !== 'Dante Sec')
        add('warn', `${l.cableId}: switch port VLAN ${pd.vlan} but ${od.name} is on VLAN ${od.vlan}`);
    }
  }
  for (const d of S.devices) if (d.rackId && !rackById(d.rackId)) add('warn', `${d.name}: assigned to a deleted rack`);
  return out;
}

/* ---------------- Rendering ---------------- */
const TABS = [

function render() {
  const issues = computeIssues();
  const errs = issues.filter(i => i.level === 'error').length;
  $('#projName').textContent = S.project.name + (S.project.venue ? ' — ' + S.project.venue : '');
  $('#nav').innerHTML = TABS.map(([id, label]) => `<button class="${UI.tab === id ? 'active' : ''}" onclick="App.tab('${id}')">${label}${id === 'project' && errs ? `<span class="badge">${errs}</span>` : ''}</button>`).join('');
  const views = {project:viewProject, racks:viewRacks, devices:viewDevices, patch:viewPatch, cables:viewCables, flow:viewFlow, network:viewNetwork, labels:viewLabels, report:viewReport, library:viewLibrary};
  $('#main').innerHTML = (views[UI.tab] || viewProject)(issues);
}

    <input placeholder="🔍 Search…" value="${esc(UI.devQ)}" oninput="App.setUI('devQ', this.value, true)" style="width:220px">
    <select onchange="App.setUI('site', this.value)">${siteOptions(UI.site, 'All sites')}</select>
    <select onchange="App.setUI('devCat', this.value)"><option value="">All categories</option>${Object.entries(CATEGORIES).map(([k, c]) => `<option value="${k}" ${k === UI.devCat ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select>
    <span class="muted">${list.length} of ${S.devices.length}</span>
  </div>
  <div class="tablewrap"><table>
    <tr><th>Name</th><th>Model</th><th>Category</th><th>Location</th><th>IP</th><th>VLAN</th><th>Ports used</th><th>Power</th><th></th></tr>
    ${list.map(d => {
      const used = d.ports.filter(p => pm.has(d.id + '|' + p.id)).length;
      return `<tr>
        <td><b style="cursor:pointer" onclick="App.editDevice('${d.id}')">${esc(d.name)}</b></td>
        <td>${esc(d.model)} <span class="muted">${esc(d.mfr || '')}</span></td>
        <td><span class="dot" style="background:${catOf(d.category).color}"></span>${esc(catOf(d.category).label.split(' (')[0])}</td>
        <td>${esc(devLocation(d))}</td><td class="mono">${esc(d.ip || '')}</td><td>${esc(d.vlan || '')}</td>
        <td>${used}/${d.ports.length}</td><td>${d.powerW ? d.powerW + ' W' : ''}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="sm" onclick="App.patchFrom('${d.id}')">Patch</button>
          <button class="sm" onclick="App.editDevice('${d.id}')">Edit</button>
          <button class="sm" onclick="App.dupDevice('${d.id}')">Duplicate</button>
          <button class="sm danger" onclick="App.delDevice('${d.id}')">✕</button></td></tr>`;
    }).join('') || `<tr><td colspan="9" class="empty">No equipment yet. Click “Add from library”.</td></tr>`}
  </table></div>`;
}

/* ---- Patch ---- */
function viewPatch() {
  if (!S.devices.length) return '<div class="empty">Add equipment first.</div>';
  const pm = portMap();
  const A = UI.patchA, B = UI.patchB;
  const selA = portOf(devById(A.d), A.p);
  const pane = (side, sel, ref) => {
    const d = devById(sel.d);
    let ports = '';
    if (d) {
      ports = d.ports.map(p => {
        const l = pm.get(d.id + '|' + p.id);
        const other = l ? otherEnd(l, d.id, p.id) : null;
        let cls = 'port' + (sel.p === p.id ? ' sel' : '') + (l ? ' used' : '');
        if (side === 'B' && ref) {
          const ok = !l && conn(ref.conn).group === conn(p.conn).group && !(A.d === d.id && A.p === p.id);
          cls += ok ? ' compat' : ' dim';
        }
        return `<div class="${cls}" onclick="App.pickPort('${side}','${p.id}')">
          <span class="dot" style="background:${conn(p.conn).color}"></span>
          <span class="pname">${esc(p.name)}</span>
          <span class="pdir" title="${p.dir}">${DIR_ICON[p.dir] || ''}</span>
          <span class="pill">${esc(p.conn)}</span>${p.proto ? `<span class="pill">${esc(p.proto)}</span>` : ''}${p.vlan ? `<span class="pill">VLAN ${esc(p.vlan)}</span>` : ''}
          <span class="plink">${l ? `<b class="mono">${esc(l.cableId)}</b> → ${esc(endText(other))}` : '<span class="ok">free</span>'}</span>
        </div>`;
      }).join('') || '<div class="muted">This device has no ports.</div>';
    }
    return `<div class="pane">
      <div class="pane-head"><b style="align-self:center">${side === 'A' ? 'FROM' : 'TO'}</b>
        <select onchange="App.pickDev('${side}', this.value)">${deviceOptions(sel.d)}</select>
        ${d ? `<button class="sm" onclick="App.editDevice('${d.id}')">Edit</button>` : ''}</div>
      ${d ? `<div class="muted" style="margin-bottom:6px">${esc(d.model)} · ${esc(devLocation(d))}${d.ip ? ' · ' + esc(d.ip) : ''}</div>` : ''}
      <div class="ports">${d ? ports : '<div class="empty">Choose a device</div>'}</div></div>`;
  };
  // connect bar
  let bar = '<span class="muted sum">Select a port on each side to create a patch.</span>';
  const ea = {d:A.d, p:A.p}, eb = {d:B.d, p:B.p};
  const usedA = A.p && pm.get(A.d + '|' + A.p);
  if (usedA && !B.p) {
    bar = `<span class="sum">Port is patched with <b class="mono">${esc(usedA.cableId)}</b> → ${esc(endText(otherEnd(usedA, A.d, A.p)))}</span>
      <button onclick="App.editLink('${usedA.id}')">Edit cable</button> <button class="danger" onclick="App.delLink('${usedA.id}')">Disconnect</button>`;
  } else if (A.p && B.p) {
    const c = checkLink(ea, eb);
    const def = conn(selA.conn);
    bar = `<div class="sum">
        <b>${esc(endText(ea))}</b> ⟶ <b>${esc(endText(eb))}</b><br>
        ${c.errors.map(e => `<span class="err">⛔ ${esc(e)}</span>`).join('<br>')}
        ${c.warns.map(e => `<span class="warn">⚠️ ${esc(e)}</span>`).join('<br>')}
        ${!c.errors.length && !c.warns.length ? '<span class="ok">✔ Compatible</span>' : ''}
      </div>
      <label class="chk">Cable <input style="width:150px" value="${esc(UI.link.cable || def.cable)}" onchange="UI.link.cable=this.value"></label>
      <label class="chk">Length (m) <input style="width:64px" type="number" min="0" step="0.5" value="${esc(UI.link.length)}" onchange="UI.link.length=this.value"></label>
      <label class="chk">Colour <select onchange="UI.link.color=this.value">${CABLE_COLORS.map(c => `<option ${c === UI.link.color ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      <label class="chk" title="Patch N consecutive free compatible ports in one go">× <input style="width:52px" type="number" min="1" max="128" value="${UI.seq}" onchange="UI.seq=Math.max(1,+this.value||1)"></label>
      <button class="primary" ${c.errors.length ? 'disabled' : ''} onclick="App.connect()">🔌 Connect</button>`;
  }
  return `<p class="muted" style="margin-top:0">Pick a source device &amp; port on the left, then a destination on the right. Compatible free ports are highlighted. Use “×N” to patch a run of consecutive ports (e.g. stagebox outs 1–8 → amp ins).</p>
    <div class="patch">${pane('A', A, null)}${pane('B', B, selA && !usedA ? selA : null)}</div>
    <div class="connectbar">${bar}</div>`;
}

/* ---- Cable schedule ---- */
function cableRows() {
  return S.links.map(l => {
    const da = devById(l.a.d), db = devById(l.b.d), pa = portOf(da, l.a.p), pb = portOf(db, l.b.p);
    return {l, cableId:l.cableId, cable:l.cable, length:l.length, color:l.color, notes:l.notes,
      fromDev:da?.name || '?', fromPort:pa?.name || '?', fromLoc:da ? devLocation(da) : '', toDev:db?.name || '?', toPort:pb?.name || '?', toLoc:db ? devLocation(db) : '',
      conn:pa?.conn || '', proto:pa?.proto || pb?.proto || '', siteA:da?.siteId, siteB:db?.siteId, cross: da && db && da.siteId !== db.siteId};
  });
}
function viewCables() {
  const q = UI.cableQ.toLowerCase();
  const {key, dir} = UI.cableSort;
  const rows = cableRows().filter(r => (!UI.cableType || r.cable === UI.cableType) && (!UI.site || r.siteA === UI.site || r.siteB === UI.site) &&
    (!q || [r.cableId, r.cable, r.fromDev, r.fromPort, r.toDev, r.toPort, r.notes, r.proto].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => String(a[key] ?? '').localeCompare(String(b[key] ?? ''), undefined, {numeric:true}) * dir);
  const types = [...new Set(S.links.map(l => l.cable))].sort();
  const th = (k, label) => `<th class="sortable" onclick="App.sortCables('${k}')">${label}${key === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  return `
  <div class="toolbar">
    <input placeholder="🔍 Search cables…" value="${esc(UI.cableQ)}" oninput="App.setUI('cableQ', this.value, true)" style="width:220px">
    <select onchange="App.setUI('site', this.value)">${siteOptions(UI.site, 'All sites')}</select>
    <select onchange="App.setUI('cableType', this.value)"><option value="">All cable types</option>${types.map(t => `<option ${t === UI.cableType ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    <span class="muted">${rows.length} cables</span><span class="spacer"></span>
    <button onclick="App.renumber()">🔢 Renumber IDs</button>
    <button onclick="App.exportCSV('cables')">⬇ CSV</button>
    <button onclick="App.tab('patch')" class="primary">+ New patch</button>
  </div>
  <div class="tablewrap"><table>
    <tr>${th('cableId', 'Cable ID')}${th('cable', 'Type')}${th('length', 'Len')}${th('fromDev', 'From device')}${th('fromPort', 'Port')}${th('fromLoc', 'Location')}<th></th>${th('toDev', 'To device')}${th('toPort', 'Port')}${th('toLoc', 'Location')}${th('proto', 'Signal')}${th('notes', 'Notes')}<th></th></tr>
    ${rows.map(r => `<tr>
      <td class="mono"><span class="dot" style="background:${conn(r.conn).color}"></span><b>${esc(r.cableId)}</b></td>
      <td>${esc(r.cable)}${r.color ? ` <span class="muted">(${esc(r.color)})</span>` : ''}</td><td>${r.length ? esc(r.length) + 'm' : ''}</td>
      <td><b>${esc(r.fromDev)}</b></td><td>${esc(r.fromPort)}</td><td class="muted">${esc(r.fromLoc)}</td><td>→</td>
      <td><b>${esc(r.toDev)}</b></td><td>${esc(r.toPort)}</td><td class="muted">${esc(r.toLoc)}${r.cross ? ' <span class="pill warn">inter-site</span>' : ''}</td>
      <td>${esc(r.proto)}</td><td>${esc(r.notes || '')}</td>
      <td style="white-space:nowrap"><button class="sm" onclick="App.editLink('${r.l.id}')">Edit</button> <button class="sm danger" onclick="App.delLink('${r.l.id}')">✕</button></td></tr>`).join('')
      || '<tr><td colspan="13" class="empty">No cables yet — use the Patch tab.</td></tr>'}
  </table></div>`;
}

/* ---- Signal flow ---- */
function viewFlow() {
  const visDev = d => !UI.flowSite || d.siteId === UI.flowSite;
  const links = S.links.filter(l => {
    const da = devById(l.a.d), db = devById(l.b.d);
    if (!da || !db || (!visDev(da) && !visDev(db))) return false;
    if (!UI.flowPower && conn(portOf(da, l.a.p)?.conn).group.startsWith('power')) return false;
    return true;
  });
  const linkedDevs = new Set(links.flatMap(l => [l.a.d, l.b.d]));
  const devs = S.devices.filter(d => linkedDevs.has(d.id) || (UI.flowAll && visDev(d) && (UI.flowPower || d.category !== 'power')));
  const toolbar = `<div class="toolbar no-print">
    <select onchange="App.setUI('flowSite', this.value)">${siteOptions(UI.flowSite, 'All sites')}</select>
    <label class="chk"><input type="checkbox" ${UI.flowPower ? 'checked' : ''} onchange="App.setUI('flowPower', this.checked)"> Power</label>
    <label class="chk"><input type="checkbox" ${UI.flowAll ? 'checked' : ''} onchange="App.setUI('flowAll', this.checked)"> Unpatched devices &amp; ports</label>
    <label class="chk"><input type="checkbox" ${UI.flowIds ? 'checked' : ''} onchange="App.setUI('flowIds', this.checked)"> Cable IDs</label>
    ${UI.flowFocus ? `<button class="sm" onclick="App.setUI('flowFocus','')">Clear highlight</button>` : '<span class="muted">Click a device to highlight its connections.</span>'}
    <span class="spacer"></span><button onclick="App.exportSVG()">⬇ SVG</button></div>`;
  if (!devs.length) return toolbar + '<div class="empty">Nothing patched yet.</div>';
  const pm = new Map();
  for (const l of links) { pm.set(l.a.d + '|' + l.a.p, l); pm.set(l.b.d + '|' + l.b.p, l); }
  // columns
  const usedCols = [...new Set(devs.map(d => catOf(d.category).col))].sort((a, b) => a - b);
  const colIdx = c => usedCols.indexOf(catOf(c).col);
  const BW = 210, GAP = 170, HEAD = 34, PR = 17, VGAP = 22, M = 20;
  const pos = new Map();
  const colY = usedCols.map(() => M + 20);
  for (const d of sortedDevices(devs)) {
    const ci = colIdx(d.category);
    const ports = d.ports.filter(p => UI.flowAll || pm.has(d.id + '|' + p.id)).filter(p => UI.flowPower || !conn(p.conn).group.startsWith('power'));
    const h = HEAD + Math.max(1, ports.length) * PR + 6;
    pos.set(d.id, {x:M + ci * (BW + GAP), y:colY[ci], h, ports, ci});
    colY[ci] += h + VGAP;
  }
  const W = M * 2 + usedCols.length * BW + (usedCols.length - 1) * GAP, H = Math.max(...colY) + M;
  const anchor = new Map();
  let boxes = '', edges = '', heads = '';
  // column headers
  const colNames = {};
  for (const d of devs) { const ci = colIdx(d.category); (colNames[ci] = colNames[ci] || new Set()).add(catOf(d.category).label.split(' (')[0]); }
  usedCols.forEach((_, ci) => { heads += `<text x="${M + ci * (BW + GAP) + BW / 2}" y="${M + 4}" fill="#64748b" font-size="11" text-anchor="middle">${esc([...colNames[ci]].join(' · ').toUpperCase())}</text>`; });
  for (const d of devs) {
    const P_ = pos.get(d.id);
    const focus = !UI.flowFocus || UI.flowFocus === d.id || links.some(l => (l.a.d === UI.flowFocus && l.b.d === d.id) || (l.b.d === UI.flowFocus && l.a.d === d.id));
    let rows = '';
    P_.ports.forEach((p, i) => {
      const l = pm.get(d.id + '|' + p.id);
      const y = P_.y + HEAD + i * PR + PR / 2;
      let side = p.dir === 'in' ? 'L' : 'R';
      if (l) {
        const o = pos.get(otherEnd(l, d.id, p.id).d);
        if (o) side = o.ci > P_.ci ? 'R' : o.ci < P_.ci ? 'L' : (p.dir === 'in' ? 'L' : 'R');
      }
      const x = side === 'L' ? P_.x : P_.x + BW;
      anchor.set(d.id + '|' + p.id, {x, y, side});
      rows += `<circle cx="${x}" cy="${y}" r="3.5" fill="${conn(p.conn).color}"/>
        <text x="${side === 'L' ? P_.x + 9 : P_.x + BW - 9}" y="${y + 4}" font-size="11" fill="${l ? '#e2e8f0' : '#64748b'}" text-anchor="${side === 'L' ? 'start' : 'end'}">${esc(p.name)}${p.proto && !['Analog', 'Power'].includes(p.proto) ? ' · ' + esc(p.proto) : ''}</text>`;
    });
    const c = catOf(d.category).color;
    boxes += `<g opacity="${focus ? 1 : .2}" style="cursor:pointer" onclick="App.setUI('flowFocus', UI.flowFocus==='${d.id}'?'':'${d.id}')" ondblclick="App.editDevice('${d.id}')">
      <rect x="${P_.x}" y="${P_.y}" width="${BW}" height="${P_.h}" rx="7" fill="#111a2e" stroke="${c}" stroke-width="1.5"/>
      <rect x="${P_.x}" y="${P_.y}" width="${BW}" height="${HEAD - 6}" rx="7" fill="${c}"/>
      <text x="${P_.x + 8}" y="${P_.y + 13}" font-size="12" font-weight="700" fill="#fff">${esc(d.name)}</text>
      <text x="${P_.x + 8}" y="${P_.y + 24}" font-size="9.5" fill="#e5e7eb" opacity=".85">${esc((d.model + (d.ip ? ' · ' + d.ip : '')).slice(0, 40))}</text>
      ${rows}</g>`;
  }
  for (const l of links) {
    const a = anchor.get(l.a.d + '|' + l.a.p), b = anchor.get(l.b.d + '|' + l.b.p);
    if (!a || !b) continue;
    const focus = !UI.flowFocus || l.a.d === UI.flowFocus || l.b.d === UI.flowFocus;
    const col = conn(portOf(devById(l.a.d), l.a.p)?.conn).color;
    const dx = Math.max(60, Math.abs(b.x - a.x) / 2);
    const c1 = a.x + (a.side === 'R' ? dx : -dx), c2 = b.x + (b.side === 'R' ? dx : -dx);
    edges += `<path d="M${a.x},${a.y} C${c1},${a.y} ${c2},${b.y} ${b.x},${b.y}" fill="none" stroke="${col}" stroke-width="${focus && UI.flowFocus ? 2.4 : 1.6}" opacity="${focus ? .9 : .08}"><title>${esc(l.cableId + ': ' + endText(l.a) + ' → ' + endText(l.b))}</title></path>`;
    if (UI.flowIds && focus) {
      const mx = (a.x + b.x) / 2 + ((a.side === 'R' ? dx : -dx) + (b.side === 'R' ? dx : -dx)) * .375, my = (a.y + b.y) / 2;
      edges += `<text x="${mx}" y="${my - 2}" font-size="9" fill="${col}" text-anchor="middle" class="mono" paint-order="stroke" stroke="#070c17" stroke-width="3">${esc(l.cableId)}</text>`;
    }
  }
  return toolbar + `<div class="flowwrap"><svg id="flowSvg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="background:#070c17">${heads}${edges}${boxes}</svg></div>`;
}

/* ---- Network ---- */
function viewNetwork() {
  const hasNet = d => d.ports.some(p => conn(p.conn).group === 'eth' || conn(p.conn).group === 'fiber');
  const list = sortedDevices(S.devices.filter(d => hasNet(d) && (!UI.netSite || d.siteId === UI.netSite)));
  const ipCount = {}; S.devices.forEach(d => { if (d.ip) ipCount[d.ip] = (ipCount[d.ip] || 0) + 1; });
  const inp = (d, k, w) => `<input class="${k === 'ip' && ipCount[d.ip] > 1 ? 'err' : ''}" data-ipfield="${k === 'ip' ? 1 : ''}" style="${w ? 'width:' + w : ''}" value="${esc(d[k] || '')}" onchange="App.setDevField('${d.id}','${k}',this.value)">`;
  const pm = portMap();
  const switches = sortedDevices(S.devices.filter(d => d.category === 'network' && (!UI.netSite || d.siteId === UI.netSite)));
  const vlans = {};
  S.devices.forEach(d => { if (d.vlan) (vlans[d.vlan] = vlans[d.vlan] || []).push(d); });
  return `
  <div class="toolbar">
    <select onchange="App.setUI('netSite', this.value)">${siteOptions(UI.netSite, 'All sites')}</select>
    <span class="spacer"></span>
    <label class="chk">Auto-fill empty IPs from <input id="ipBase" style="width:130px" value="192.168.1.10" class="mono"></label>
    <label class="chk">mask <input id="ipMask" style="width:120px" value="255.255.255.0" class="mono"></label>
    <button onclick="App.autoIP()">⚙ Assign</button>
    <button onclick="App.exportCSV('ip')">⬇ IP schedule CSV</button>
  </div>
  <div class="card"><h3>IP schedule</h3><div class="tablewrap"><table>
    <tr><th>Device</th><th>Location</th><th>Hostname</th><th>IP address</th><th>Subnet mask</th><th>Gateway</th><th>VLAN</th><th>MAC</th></tr>
    ${list.map(d => `<tr><td><b>${esc(d.name)}</b><br><span class="muted">${esc(d.model)}</span></td><td class="muted">${esc(devLocation(d))}</td>
      <td>${inp(d, 'hostname')}</td><td class="mono">${inp(d, 'ip')}</td><td class="mono">${inp(d, 'mask')}</td><td class="mono">${inp(d, 'gateway')}</td><td>${inp(d, 'vlan', '70px')}</td><td class="mono">${inp(d, 'mac')}</td></tr>`).join('')
      || '<tr><td colspan="8" class="empty">No networked devices.</td></tr>'}
  </table></div></div>
  ${Object.keys(vlans).length ? `<div class="card"><h3>VLANs</h3>${Object.entries(vlans).sort((a, b) => a[0] - b[0]).map(([v, ds]) => `<div style="margin-bottom:4px"><span class="pill">VLAN ${esc(v)}</span> ${ds.map(d => esc(d.name)).join(', ')}</div>`).join('')}</div>` : ''}
  <div class="grid g2">
  ${switches.map(sw => `<div class="card"><h3>🔀 ${esc(sw.name)} — port map <span class="muted" style="font-weight:normal">${esc(sw.model)} ${sw.ip ? '· ' + esc(sw.ip) : ''}</span></h3>
    <table><tr><th>Port</th><th>VLAN</th><th>Cable</th><th>Connected to</th><th>Remote IP</th></tr>
    ${sw.ports.filter(p => conn(p.conn).group === 'eth' || conn(p.conn).group === 'fiber').map(p => {
      const l = pm.get(sw.id + '|' + p.id); const o = l && otherEnd(l, sw.id, p.id); const od = o && devById(o.d);
      return `<tr><td><span class="dot" style="background:${conn(p.conn).color}"></span>${esc(p.name)}</td>
        <td><input style="width:60px" value="${esc(p.vlan || '')}" onchange="App.setPortField('${sw.id}','${p.id}','vlan',this.value)"></td>
        <td class="mono">${l ? esc(l.cableId) : ''}</td><td>${od ? `<b>${esc(od.name)}</b> · ${esc(portOf(od, o.p)?.name)}` : '<span class="muted">—</span>'}</td><td class="mono">${od ? esc(od.ip || '') : ''}</td></tr>`;
    }).join('')}</table></div>`).join('')}
  </div>`;
}

/* ---- Labels ---- */
function viewLabels() {
  const types = [...new Set(S.links.map(l => l.cable))].sort();
  const links = [...S.links].filter(l => !UI.labelType || l.cable === UI.labelType).sort((a, b) => a.cableId.localeCompare(b.cableId, undefined, {numeric:true}));
  const lab = (l, end) => {
    const here = end === 'A' ? l.a : l.b, there = end === 'A' ? l.b : l.a;
    const dh = devById(here.d);
    return `<div class="label"><div class="bar" style="background:${conn(portOf(dh, here.p)?.conn).color}"></div>
      <span class="end">${end}</span><div class="cid">${esc(l.cableId)}</div>
      <div><b>THIS END:</b> ${esc(endText(here))}</div><div><b>OTHER END:</b> ${esc(endText(there))}</div>
      <div style="color:#555">${esc(l.cable)}${l.length ? ' · ' + esc(l.length) + 'm' : ''}${l.color ? ' · ' + esc(l.color) : ''}</div></div>`;
  };
  return `<div class="toolbar no-print">
      <select onchange="App.setUI('labelType', this.value)"><option value="">All cable types</option>${types.map(t => `<option ${t === UI.labelType ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <span class="muted">${links.length * 2} labels (both ends)</span><span class="spacer"></span>

  const bom = {};

  const totals = {};
  S.links.forEach(l => { totals[l.cable] = (totals[l.cable] || 0) + (+l.length || 0); });

      else html += `<tr><td style="width:24px;color:#64748b">${u}</td><td></td></tr>`;
    }
    const w = S.devices.filter(d => d.rackId === r.id).reduce((t, d) => t + (+d.powerW || 0), 0);
    return `<div class="mini-rack"><b>${esc(r.name)}</b> <span style="color:#64748b">${r.heightU}U · ${w} W</span><table>${html}</table></div>`;
  };
  return `<div class="toolbar no-print"><span class="muted">Printable technical rider / patch book. Use your browser's “Save as PDF” to export.</span><span class="spacer"></span>
      <button onclick="App.exportCSV('cables')">⬇ Cable CSV</button><button onclick="App.exportCSV('devices')">⬇ Equipment CSV</button>
      <button class="primary" onclick="window.print()">🖨 Print / PDF</button></div>
  <div class="report">
    <h1>${esc(p.name)}</h1><div style="color:#475569">Technical rider &amp; patch schedule · Rev ${esc(p.revision)}</div>
    <div class="meta">
      <div><span>Client</span>${esc(p.client) || '—'}</div><div><span>Venue</span>${esc(p.venue) || '—'}</div>
      <div><span>Date</span>${esc(p.date) || '—'}</div><div><span>Engineer</span>${esc(p.engineer) || '—'}</div>
      <div><span>Contact</span>${esc(p.contact) || '—'}</div><div><span>Devices</span>${S.devices.length}</div>
      <div><span>Cables</span>${S.links.length}</div><div><span>Generated</span>${new Date().toLocaleString()}</div>
    </div>
    ${p.notes ? `<p style="white-space:pre-wrap">${esc(p.notes)}</p>` : ''}
    ${issues.length ? `<p style="color:#b45309">⚠ ${issues.length} open validation item(s) — see list at end.</p>` : ''}

    <h2>1. Equipment list</h2>
    <table><tr><th>Qty</th><th>Manufacturer</th><th>Model</th><th>Category</th><th>Units</th></tr>
    ${Object.values(eq).sort((a, b) => catOf(a.cat).col - catOf(b.cat).col || a.model.localeCompare(b.model)).map(e => `<tr><td><b>${e.names.length}</b></td><td>${esc(e.mfr || '')}</td><td>${esc(e.model)}</td><td>${esc(catOf(e.cat).label.split(' (')[0])}</td><td>${esc(e.names.sort((a, b) => a.localeCompare(b, undefined, {numeric:true})).join(', '))}</td></tr>`).join('')}</table>

    <h2>2. Sites &amp; rack elevations</h2>
    ${S.sites.map(s => {
      const racks = S.racks.filter(r => r.siteId === s.id);
      const nr = sortedDevices(S.devices.filter(d => d.siteId === s.id && !rackById(d.rackId)));
      return `<h3>📍 ${esc(s.name)} ${s.location ? '— ' + esc(s.location) : ''}</h3>
        <div>${racks.map(miniRack).join('')}</div>
        ${nr.length ? `<table><tr><th>Non-rack equipment</th><th>Model</th><th>Position</th><th>IP</th></tr>${nr.map(d => `<tr><td>${esc(d.name)}</td><td>${esc(d.model)}</td><td>${esc(d.location || '')}</td><td>${esc(d.ip || '')}</td></tr>`).join('')}</table>` : ''}`;
    }).join('')}

    <h2 class="pb">3. Cable / patch schedule</h2>
    <table><tr><th>Cable ID</th><th>Type</th><th>Len</th><th>From</th><th>Port</th><th>Location</th><th>To</th><th>Port</th><th>Location</th><th>Signal</th><th>Notes</th></tr>
    ${rows.map(r => `<tr><td><b>${esc(r.cableId)}</b></td><td>${esc(r.cable)}</td><td>${r.length ? esc(r.length) + 'm' : ''}</td><td>${esc(r.fromDev)}</td><td>${esc(r.fromPort)}</td><td>${esc(r.fromLoc)}</td><td>${esc(r.toDev)}</td><td>${esc(r.toPort)}</td><td>${esc(r.toLoc)}</td><td>${esc(r.proto)}</td><td>${esc(r.notes || '')}</td></tr>`).join('')}</table>

    <h2>4. Cable pull list (BOM)</h2>
    <table><tr><th>Cable type</th><th>Length</th><th>Qty</th></tr>
    ${Object.values(bom).sort((a, b) => a.cable.localeCompare(b.cable) || (+a.length || 0) - (+b.length || 0)).map(b => `<tr><td>${esc(b.cable)}</td><td>${b.length ? esc(b.length) + ' m' : '<i>tbc</i>'}</td><td><b>${b.n}</b></td></tr>`).join('')}

        return `<tr><td>${esc(p.name)}</td><td>${esc(p.vlan || '')}</td><td>${esc(l.cableId)}</td><td>${esc(od?.name)}</td><td>${esc(portOf(od, o.p)?.name)}</td></tr>`;
      }).join('')}</table>`;
    }).join('')}

    <h2>6. Power</h2>
    <table><tr><th>Site</th><th>Rack / position</th><th>Devices</th><th>Est. load</th></tr>
    ${S.sites.map(s => {
      const groups = {};
      S.devices.filter(d => d.siteId === s.id).forEach(d => { const k = rackById(d.rackId)?.name || 'Non-rack'; (groups[k] = groups[k] || []).push(d); });
      return Object.entries(groups).map(([k, ds]) => `<tr><td>${esc(s.name)}</td><td>${esc(k)}</td><td>${ds.length}</td><td>${ds.reduce((t, d) => t + (+d.powerW || 0), 0)} W</td></tr>`).join('');

    ${issues.length ? `<h2>7. Open items</h2><ul>${issues.map(i => `<li>${i.level === 'error' ? '⛔' : '⚠'} ${esc(i.msg)}</li>`).join('')}</ul>` : ''}
  </div>`;
}

/* ---------------- CSV / files ---------------- */
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const fileBase = () => (S.project.name || 'project').replace(/[^\w\-]+/g, '_');

/* ---------------- Actions (exposed) ---------------- */
const App = {
  tab(t) { UI.tab = t; render(); window.scrollTo(0, 0); },
  setUI(k, v, keepFocus) {
    UI[k] = v;
    if (keepFocus) { const el = document.activeElement, pos = el && el.selectionStart; render(); const n = document.querySelector(`[oninput*="'${k}'"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }
    else render();
  },
  closeModal,
  undo() { if (!undoStack.length) return toast('Nothing to undo'); S = normalize(JSON.parse(undoStack.pop())); save(); render(); toast('Undone'); },
  setProj(k, v) { snap(); S.project[k] = v; commit(); },

  /* Sites & racks */
  editSite(id) {
    const s = id ? siteById(id) : {name:'', location:''};
    openModal(`<h2>${id ? 'Edit site' : 'New site'}</h2><div class="form">
      <label>Site name<input id="sName" value="${esc(s.name)}" placeholder="e.g. Main Auditorium"></label>
      <label>Address / description<input id="sLoc" value="${esc(s.location || '')}" placeholder="e.g. Level 2, Building A"></label></div>
      <div class="actions">${id ? `<button class="danger" onclick="App.delSite('${id}')">Delete site</button>` : ''}<span class="spacer"></span>
      <button onclick="App.closeModal()">Cancel</button><button class="primary" onclick="App.saveSite(${id ? `'${id}'` : 'null'})">Save</button></div>`);
  },
  saveSite(id) {
    const name = $('#sName').value.trim(); if (!name) return toast('Name required');
    snap();
    if (id) Object.assign(siteById(id), {name, location:$('#sLoc').value});
    else { const s = {id:uid(), name, location:$('#sLoc').value}; S.sites.push(s); UI.site = s.id; }
    closeModal(); commit();
  },
  delSite(id) {
    const n = S.devices.filter(d => d.siteId === id).length;
    if (!confirm(`Delete this site and its racks?${n ? ` ${n} devices will be kept but unassigned.` : ''}`)) return;
    snap();
    const rackIds = S.racks.filter(r => r.siteId === id).map(r => r.id);
    S.racks = S.racks.filter(r => r.siteId !== id); S.sites = S.sites.filter(s => s.id !== id);
    S.devices.forEach(d => { if (d.siteId === id) d.siteId = ''; if (rackIds.includes(d.rackId)) { d.rackId = ''; d.uPos = 0; } });
    closeModal(); commit();
  },
  editRack(id, siteId) {
    if (!S.sites.length) return toast('Create a site first');
    const r = id ? rackById(id) : {name:'Rack ' + pad(S.racks.length + 1), heightU:42, siteId:siteId || UI.site || S.sites[0].id, location:'', maxW:''};
    openModal(`<h2>${id ? 'Edit rack' : 'New rack'}</h2><div class="form">
      <label>Rack name<input id="rName" value="${esc(r.name)}"></label>
      <label>Height (U)<input id="rU" type="number" min="1" max="60" value="${r.heightU}"></label>
      <label>Site<select id="rSite">${siteOptions(r.siteId)}</select></label>
      <label>Location in site<input id="rLoc" value="${esc(r.location || '')}" placeholder="e.g. Comms room / SR"></label>
      <label>Power budget (W, optional)<input id="rW" type="number" min="0" value="${esc(r.maxW || '')}"></label></div>
      <div class="actions">${id ? `<button class="danger" onclick="App.delRack('${id}')">Delete rack</button>` : ''}<span class="spacer"></span>
      <button onclick="App.closeModal()">Cancel</button><button class="primary" onclick="App.saveRack(${id ? `'${id}'` : 'null'})">Save</button></div>`);
  },
  saveRack(id) {
    const v = {name:$('#rName').value.trim() || 'Rack', heightU:Math.max(1, +$('#rU').value || 42), siteId:$('#rSite').value, location:$('#rLoc').value, maxW:+$('#rW').value || 0};
    snap();
    if (id) {
      Object.assign(rackById(id), v);
      S.devices.filter(d => d.rackId === id).forEach(d => d.siteId = v.siteId);
    } else S.racks.push({id:uid(), ...v});
    closeModal(); commit();
  },
  delRack(id) {
    if (!confirm('Delete rack? Its devices will become unracked.')) return;
    snap(); S.racks = S.racks.filter(r => r.id !== id);
    S.devices.forEach(d => { if (d.rackId === id) { d.rackId = ''; d.uPos = 0; } });
    closeModal(); commit();
  },
  goRack(siteId) { UI.site = siteId; App.tab('racks'); },

  /* Drag & drop racking */
  dragStart(e, id) { UI.drag = id; e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; setTimeout(() => document.body.classList.add('dragging'), 0); },
  dragEnd() { document.body.classList.remove('dragging'); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); },
  dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); },
  dropU(e, rackId, topU) {
    e.preventDefault(); App.dragEnd();
    const d = devById(e.dataTransfer.getData('text/plain') || UI.drag); if (!d) return;
    const h = Math.max(1, d.uHeight || 1), bottom = topU - h + 1;
    if (!fits(rackId, bottom, h, d.id)) return toast(`${d.name} (${h}U) doesn't fit at U${topU} — space occupied or out of range`);
    snap(); d.rackId = rackId; d.uPos = bottom; d.siteId = rackById(rackId).siteId; commit();
  },
  dropTray(e) { e.preventDefault(); App.dragEnd(); App.unrack(e.dataTransfer.getData('text/plain') || UI.drag); },
  unrack(id) { const d = devById(id); if (!d || !d.rackId) return; snap(); d.rackId = ''; d.uPos = 0; commit(); },

  /* Devices */
  addFromLibrary(tid) {
    const tpls = allTemplates();
    const t = tpls.find(x => x.id === tid) || tpls[0];
    const site = UI.site && siteById(UI.site) ? UI.site : (S.sites[0]?.id || '');
    openModal(`<h2>Add equipment</h2><div class="form">
      <label class="full">Template<select id="aT" onchange="App.addTplChange()">${Object.entries(CATEGORIES).map(([k, c]) => {
        const l = tpls.filter(x => x.category === k); return l.length ? `<optgroup label="${esc(c.label)}">${l.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.model)}${x.mfr && x.mfr !== 'Generic' ? ' — ' + esc(x.mfr) : ''}${x.uHeight ? ` (${x.uHeight}U)` : ''}</option>`).join('')}</optgroup>` : '';
      }).join('')}</select></label>

  connect() {
    const A = UI.patchA, B = UI.patchB;
    const da = devById(A.d), db = devById(B.d), pa = portOf(da, A.p);
    const n = Math.max(1, UI.seq || 1);
    const pm = portMap();
    const run = (d, startId, group, excl) => {
      const idx = d.ports.findIndex(p => p.id === startId), out = [];
      for (let i = idx; i < d.ports.length && out.length < n; i++) {
        const p = d.ports[i];
        if (conn(p.conn).group !== group || pm.has(d.id + '|' + p.id) || excl.has(p.id)) continue;
        out.push(p);
      }
      return out;
    };
    const g = conn(pa.conn).group;
    const ra = run(da, A.p, g, new Set());
    const rb = run(db, B.p, g, da.id === db.id ? new Set(ra.map(p => p.id)) : new Set());
    const count = Math.min(ra.length, rb.length);
    snap();
    const made = [];
    for (let i = 0; i < count; i++) {
      const a = {d:da.id, p:ra[i].id}, b = {d:db.id, p:rb[i].id};

function nextNum(prefix) {
  let max = 0;
  const re = new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '-?(\\d+)$', 'i');
  S.devices.forEach(d => { const m = re.exec(d.name); if (m) max = Math.max(max, +m[1]); });
  return max + 1;
}
function instantiate(t, name, siteId) {
  return {id:uid(), name, model:t.model, mfr:t.mfr || '', category:t.category, uHeight:t.uHeight || 0, powerW:t.powerW || 0,
    siteId:siteId || '', rackId:'', uPos:0, location:'', ip:'', vlan:'', hostname:'', notes:'',
    ports:t.ports.map(p => ({id:uid(), name:p.name, conn:p.conn, dir:p.dir, proto:p.proto || '', vlan:p.vlan || ''}))};
}

  const spkB = D('t-aspk', 'SPK-05', br, null, {location:'Ceiling L', ip:'10.10.10.63', vlan:'10', ...net});
  // VLAN access ports on core switches
  sw1.ports.slice(0, 12).forEach(p => p.vlan = '10'); sw1.ports.slice(12, 18).forEach(p => p.vlan = '30'); sw1.ports.slice(18, 24).forEach(p => p.vlan = '40');

  L(sw1, 'SFP 25', fpp1, 'R 1', 1, {notes:'Trunk to FOH'}); L(sw1, 'SFP 26', fpp1, 'R 2', 1, {notes:'Trunk to Breakout 2'});
  L(fpp1, 'F 1', sw3, 'SFP 9', 60, {cable:'LC-LC OS2 Duplex', notes:'Tie-line via floor duct'}); L(fpp1, 'F 2', sw4, 'SFP 9', 85, {cable:'LC-LC OS2 Duplex', notes:'Riser tie-line'});
  L(sw2, 'SFP 25', sw1, 'SFP 27', 0.5, {notes:'ISL'});
  // Dante
  L(sb1, 'Dante Pri', sw1, 'Port 1', 30, {color:'Blue'}); L(sb1, 'Dante Sec', sw2, 'Port 1', 30, {color:'Red'});
  L(amp1, 'Dante Pri', sw1, 'Port 2', 1, {color:'Blue'}); L(amp1, 'Dante Sec', sw2, 'Port 2', 1, {color:'Red'});
  L(amp2, 'Dante Pri', sw1, 'Port 3', 1, {color:'Blue'}); L(amp2, 'Dante Sec', sw2, 'Port 3', 1, {color:'Red'});
  L(rx1, 'Dante', sw1, 'Port 4', 1, {color:'Blue'}); L(rx2, 'Dante', sw1, 'Port 5', 1, {color:'Blue'});
  L(desk, 'Dante Pri', sw3, 'Port 1', 3, {color:'Blue'}); L(desk, 'Dante Sec', sw3, 'Port 2', 3, {color:'Red', notes:'TODO: move to secondary network'});
  pc.ports.find(p => p.name === 'Dante VSC').vlan = '10';
  L(pc, 'Dante VSC', sw1, 'Port 6', 1, {color:'Blue'});
  // Video / control IP
  L(cam1, 'LAN/PoE+', sw1, 'Port 13', 45); L(cam2, 'LAN/PoE+', sw1, 'Port 14', 30);
  L(pc, 'LAN', sw1, 'Port 19', 1); L(ctl, 'LAN', sw1, 'Port 20', 1); L(rtr, 'Ethernet', sw1, 'Port 21', 1); L(proj, 'LAN', sw1, 'Port 22', 40); L(lcd1, 'LAN', sw1, 'Port 23', 15);
  L(vsw, 'Ethernet', sw3, 'Port 3', 1); L(rec, 'LAN', sw3, 'Port 4', 1); L(tp, 'LAN/PoE', sw3, 'Port 5', 3);
  L(dsp, 'Dante Pri', sw4, 'Port 1', 1); L(dsp, 'Control', sw4, 'Port 2', 1); L(cmic, 'Dante/PoE', sw4, 'Port 3', 12); L(spkB, 'Dante', sw4, 'Port 4', 10);
  L(enc, 'LAN/PoE', sw4, 'Port 5', 15); L(dec, 'LAN/PoE', sw4, 'Port 6', 8); L(dec, 'HDMI Out', lcd2, 'HDMI 1', 2);
  // Audio analog
  for (let i = 1; i <= 2; i++) L(rx1, 'Out ' + i, sb1, 'In ' + i, 30, {notes:'Lectern / MC handhelds'});
  L(amp1, 'Out 1', spkL, 'Input', 25); L(amp1, 'Out 2', spkR, 'Input', 25); L(amp1, 'Out 3', sub, 'Input', 20); L(amp2, 'Out 1', fill, 'Input', 15);
  // SDI

  L(rtr, 'Out 1', vsw, 'SDI In 1', 60, {notes:'Via SDI tie-lines TL-1'}); L(rtr, 'Out 2', vsw, 'SDI In 2', 60, {notes:'Via SDI tie-lines TL-2'});
  L(vsw, 'SDI Out 1', rec, 'SDI In', 1); L(vsw, 'SDI Out 2', proj, 'SDI In', 70, {notes:'Programme to projector'}); L(pc, 'HDMI Out 1', lcd1, 'HDMI 1', 15);
  // Power
  L(pdu1, 'Outlet 1', sw1, 'PSU', 1); L(pdu1, 'Outlet 2', sw2, 'PSU', 1); L(pdu1, 'Outlet 3', rx1, 'PSU', 1); L(pdu1, 'Outlet 4', rx2, 'PSU', 1);
  L(pdu2, 'Outlet 1', rtr, 'PSU', 1); L(pdu2, 'Outlet 2', pc, 'PSU', 1); L(pdu2, 'Outlet 3', ctl, 'PSU', 1);
  L(pdu3, 'Outlet 1', sw3, 'PSU', 1); L(pdu3, 'Outlet 2', vsw, 'PSU', 1); L(pdu3, 'Outlet 3', rec, 'PSU', 1); L(pdu3, 'Outlet 4', desk, 'PSU', 3);
  const result = S;
  S = prev;
  return result;
}

});
